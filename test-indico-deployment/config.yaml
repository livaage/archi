# Complete Indico Test Deployment Configuration
# Deploy with: archi create indico-test --config-dir test-indico-deployment --sources indico --services chatbot

name: indico-test

deployment:
  name: indico-test
  description: "Test deployment for Indico event scraping with slide conversion"

data_manager:
  sources:
    # === INDICO SOURCE (NEW!) ===
    indico:
      enabled: true
      visible: true
      schedule: ''  # Leave empty for manual collection
      base_url: https://indico.cern.ch
      use_sso: false  # Set true + provide authorized credentials for protected events
      # Day filtering: max_days limits to first N days of event
      max_days: 1
      sso_kwargs:
        headless: true
        site_type: generic
      slide_conversion:
        enabled: true
        store_originals: false  # Only store markdown
        formats:
          - pdf
          - pptx
          - ppt
          - odp
        llm_enabled: false  # Future: LLM-based image descriptions
        llm_model: null
      plot_extraction:
        enabled: false  # Future: plot extraction from slides
    
    # === OTHER SOURCES (NEEDED FOR INDICO) ===
    links:
      enabled: true
      base_source_depth: 1
      max_pages: null
      visible: false
      schedule: ''
      input_lists:
        - indico_events.list
      html_scraper:
        reset_data: true
        verify_urls: false
        enable_warnings: false
      selenium_scraper:
        enabled: false
    
    git:
      enabled: false
      visible: false
      schedule: ''
    
    sso:
      enabled: false
      visible: false
      schedule: ''
    
    jira:
      enabled: false
      visible: false
      schedule: ''
      url: ''
      projects: []
      anonymize_data: false
      max_tickets: 10000000000
      cutoff_date: ''
    
    redmine:
      enabled: false
      visible: false
      schedule: ''
      url: ''
      project: ''
  
  # === EMBEDDING & CHUNKING CONFIGURATION ===
  # Note: Vectorstore is now Postgres-only (Chroma was removed upstream)
  collection_name: indico_test_collection
  embedding_name: HuggingFaceEmbeddings
  reset_collection: true  # Fresh start for testing
  chunk_size: 1000
  chunk_overlap: 200
  distance_metric: cosine
  stemming:
    enabled: false

# === SERVICES CONFIGURATION ===
services:
  # PostgreSQL (required - now the only vectorstore backend)
  postgres:
    port: 5432
    user: archi
    database: archi-db
  
  # Vectorstore settings (Postgres with pgvector)
  vectorstore:
    backend: postgres
    distance_metric: cosine

  # Chat Interface (for testing RAG with Indico data)
  chat_app:
    pipeline: QAPipeline
    port: 7861
    external_port: 7861
    host: 0.0.0.0
    hostname: localhost
    flask_debug_mode: false
    auth:
      enabled: false

  # Data Manager (required for ingestion)
  data_manager:
    enabled: true
    port: 8001
    external_port: 7871
    schedule_enabled: false  # Disable scheduled runs for testing
    auth:
      enabled: false

  # Uploader (optional - for adding documents via UI)
  uploader:
    enabled: false
    external_port: 5001

  # Other services (disabled for this test)
  piazza:
    enabled: false
  
  redmine:
    enabled: false
  
  mattermost:
    enabled: false
  
  grafana:
    enabled: false
  
  grader:
    enabled: false
  
  benchmark:
    enabled: false

# === ARCHI CORE CONFIGURATION ===
archi:
  pipelines:
    - QAPipeline
  agent_description: "Indico events and slides knowledge base"
  pipeline_map:
    QAPipeline:
      max_tokens: 10000
      prompts:
        required:
          condense_prompt: prompts/condense/default.prompt
          chat_prompt: prompts/chat/default.prompt
      models:
        required:
          condense_model: OpenAILLM
          chat_model: OpenAILLM
  model_class_map:
    OpenAILLM:
      class: OpenAILLM
      kwargs:
        model_name: gpt-4o-mini
        temperature: 0.7

# === LOGGING ===
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - console
    - file
  file:
    path: logs/indico-test.log
    max_bytes: 10485760  # 10MB
    backup_count: 5

# === UTILITIES ===
utils:
  anonymizer:
    enabled: false
  
  sso:
    enabled: false

